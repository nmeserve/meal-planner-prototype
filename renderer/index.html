<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Weekly Meal Planner Prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-root">
      <header class="app-header">
        <h1>Weekly Meal Planner Prototype</h1>
      </header>

      <main class="app-main">
        <section class="config-panel">
          <h2>Configuration</h2>
          <form id="config-form" class="config-form">
            <div class="form-row">
              <label for="portion-size">Portion size (number of servings)</label>
              <input
                id="portion-size"
                name="portionSize"
                type="number"
                min="1"
                step="1"
                value="4"
              />
            </div>

            <div class="themes-grid">
              <div class="theme-row">
                <label for="theme-monday">Monday theme</label>
                <input id="theme-monday" name="monday" type="text" placeholder="Italian" />
              </div>
              <div class="theme-row">
                <label for="theme-tuesday">Tuesday theme</label>
                <input id="theme-tuesday" name="tuesday" type="text" placeholder="Mexican" />
              </div>
              <div class="theme-row">
                <label for="theme-wednesday">Wednesday theme</label>
                <input id="theme-wednesday" name="wednesday" type="text" placeholder="Slow Cooker" />
              </div>
              <div class="theme-row">
                <label for="theme-thursday">Thursday theme</label>
                <input id="theme-thursday" name="thursday" type="text" placeholder="Healthy" />
              </div>
              <div class="theme-row">
                <label for="theme-friday">Friday theme</label>
                <input id="theme-friday" name="friday" type="text" placeholder="Comfort Food" />
              </div>
              <div class="theme-row">
                <label for="theme-saturday">Saturday theme</label>
                <input id="theme-saturday" name="saturday" type="text" placeholder="Grill" />
              </div>
              <div class="theme-row">
                <label for="theme-sunday">Sunday theme</label>
                <input id="theme-sunday" name="sunday" type="text" placeholder="Leftovers" />
              </div>
            </div>

            <button type="button" id="generate-btn" class="primary-button">
              Generate Weekly Framework
            </button>
          </form>
        </section>

        <section class="calendar-panel">
          <h2>Weekly Calendar</h2>
          <div id="calendar-grid" class="calendar-grid">
            <!-- Calendar cells are rendered by app.js -->
          </div>
          <h3 class="selected-recipes-heading">Selected recipe (per day)</h3>
          <div id="selected-recipes-grid" class="calendar-grid selected-recipes-grid">
            <!-- Selected recipe per day rendered by app.js; blank until a recipe is chosen -->
          </div>
        </section>
      </main>
    </div>

    <!-- Recipe popup modal: two views = "pick" (choose 1 of 3) or "detail" (ingredients + instructions) -->
    <div id="recipe-modal" class="recipe-modal">
      <div class="recipe-modal-backdrop" id="recipe-modal-backdrop"></div>
      <div class="recipe-modal-box">
        <button type="button" class="recipe-modal-close" id="recipe-modal-close" aria-label="Close">×</button>
        <h2 class="recipe-modal-title" id="recipe-modal-title">MONDAY – ITALIAN</h2>
        <!-- Pick view: loading / error / 3 recipe options to select -->
        <div id="recipe-modal-pick-view" class="recipe-modal-body">
          <p class="recipe-modal-loading" id="recipe-modal-loading" hidden>Generating recipes...</p>
          <p class="recipe-modal-error" id="recipe-modal-error" hidden>Could not generate recipes. Try again.</p>
          <ul class="recipe-modal-list" id="recipe-modal-list" hidden></ul>
        </div>
        <!-- Detail view: ingredients + instructions for the locked-in recipe -->
        <div id="recipe-modal-detail-view" class="recipe-modal-detail-body" hidden>
          <h3 class="recipe-detail-section-title">Ingredients</h3>
          <ul id="recipe-modal-ingredients" class="recipe-detail-list"></ul>
          <h3 class="recipe-detail-section-title">Instructions</h3>
          <ol id="recipe-modal-instructions" class="recipe-detail-list"></ol>
        </div>
        <div class="recipe-modal-actions" id="recipe-modal-actions-pick">
          <button type="button" class="primary-button recipe-modal-roll" id="recipe-modal-roll">Roll Again</button>
          <button type="button" class="secondary-button recipe-modal-close-btn" id="recipe-modal-close-btn">Close</button>
        </div>
        <div class="recipe-modal-actions" id="recipe-modal-actions-detail" hidden>
          <button type="button" class="primary-button" id="recipe-modal-pick-different">Pick different recipe</button>
          <button type="button" class="secondary-button recipe-modal-close-btn" id="recipe-modal-close-btn-detail">Close</button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
  </html>
