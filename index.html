<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Meal Planner Prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-logo">🥗</span>
          <div class="brand-text">
            <h1>Meal Planner</h1>
            <p>Plan your week of meals with ease</p>
          </div>
        </div>
        <button class="primary-button" id="new-plan-btn">New Weekly Plan</button>
      </header>

      <main class="app-main">
        <section class="panel">
          <header class="panel-header">
            <h2>Weekly Overview</h2>
            <span class="pill pill-soft">Prototype</span>
          </header>
          <div class="week-grid" id="week-grid">
            <!-- Days of week will be injected by renderer.js -->
          </div>
        </section>

        <section class="panel">
          <header class="panel-header">
            <h2>Selected Day</h2>
            <span id="selected-day-label" class="subtle-text">Nothing selected yet</span>
          </header>
          <div class="day-details" id="day-details">
            <p class="empty-state">
              Select a day to start adding meals. This is a visual shell so far; we’ll wire up real data next.
            </p>
          </div>
        </section>
      </main>
    </div>

    <script src="./renderer.js"></script>
  </body>
  </html>
